<!doctype html>
<html>
  <head>
    <title>Button in React</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  </head>

  <body>
    <script>
      //React JS and ReactDOM code

      //React Element
      const button_ReactElement = React.createElement(
        "button",
        null,
        "React Button",
      );

      //Adding React Element into the Browser DOM
      ReactDOM.render(button_ReactElement, document.querySelector("body"));
    </script>
  </body>
</html>
