<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="./Card.css" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      function CreateCard({ name, description, url }) {
        //data = {name:"---",url:"----",description:"----"}
        return (
          <div id="card">
            <img src={url} width="100%" height="230" alt="" />
            <h2>{name}</h2>
            <p>{description}</p>
          </div>
        );
      }

      function App() {
        return (
          <div id="container">
            <CreateCard
              name={"Rajiv"}
              url={
                "https://techcloudltd.com/wp-content/uploads/2024/06/male-professional-headshots-1024x638.webp"
              }
              description={`Confident, ambitious man seeking meaningful connections, adventure, laughter, and genuine conversations every day.`}
            />

            <CreateCard
              name={"Rahul"}
              url={
                "https://static.vecteezy.com/system/resources/previews/029/891/975/non_2x/business-american-man-in-light-cream-ai-generative-free-photo.jpg"
              }
              description={
                "Ambitious, kind-hearted man balancing work, hobbies, friendships, and exciting life adventures."
              }
            />
            <CreateCard
              name={"Rohan"}
              url={
                "https://i.pinimg.com/originals/e3/7e/0e/e37e0e25686c2139b281a57a5b4906f2.jpg"
              }
              description={
                "Curious, confident man exploring life, passions, friendships, and opportunities with optimism daily."
              }
            />
            <CreateCard
              name={"Rohit"}
              url={
                "https://tse1.mm.bing.net/th/id/OIP.4Sf5Qzlwrq-0iNoydcGW0wHaLH?rs=1&pid=ImgDetMain&o=7&rm=3"
              }
              description={
                "Driven male who values honesty, loyalty, humor, and building unforgettable moments together."
              }
            />
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
