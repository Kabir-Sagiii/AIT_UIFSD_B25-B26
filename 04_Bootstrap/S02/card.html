<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="w-25 card m-5">
      <div class="card-header">
        <h3 class="text-primary text-center">Login Form</h3>
      </div>
      <div class="card-body">
        <div class="my-3">
          <input class="form-control" type="text" placeholder="email id" />
        </div>
        <div class="my-3">
          <input class="form-control" type="password" placeholder="password" />
        </div>

        <div class="d-flex justify-content-center">
          <div class="mx-3">
            <input
              checked
              class="form-check"
              type="radio"
              id="male"
              name="gender"
            />
            <label for="male">male</label>
          </div>
          <div class="mx-3">
            <input class="form-check" type="radio" id="female" name="gender" />
            <label for="female">female</label>
          </div>
          <div class="mx-3">
            <input class="form-check" type="radio" id="other" name="gender" />
            <label for="other">Other</label>
          </div>
        </div>

        <div class="my-3 text-center">
          <button class="btn btn-outline-primary px-5">Login</button>
        </div>
      </div>

      <div class="card-footer">
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Dicta,</p>
      </div>
    </div>
  </body>
</html>
